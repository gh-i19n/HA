spring:
  profiles:
    active: test
  datasource:
    url: jdbc:h2:mem:healthalst;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    properties:
      hibernate:
        '[default_schema]': healthalst
  flyway:
    enabled: true
    schemas: healthalst
    default-schema: healthalst
    create-schemas: true

