spring:
  application:
    name: healthAlst
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_MAX_POOL_SIZE:20}
      minimum-idle: ${SPRING_DATASOURCE_MIN_IDLE:2}
      connection-timeout: ${SPRING_DATASOURCE_CONNECTION_TIMEOUT_MS:5000}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        '[default_schema]': healthalst
    open-in-view: false
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    schemas: ${SPRING_FLYWAY_SCHEMAS:healthalst}
    default-schema: ${SPRING_FLYWAY_DEFAULT_SCHEMA:healthalst}
    create-schemas: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

# cors:
#   allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3003}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}

healthalst:
  app-url: ${HEALTHALST_APP_URL:http://localhost:3003}
  email:
    # `noop` is the safe default for test/CI runs. Set EMAIL_PROVIDER=resend with
    # RESEND_API_KEY and EMAIL_FROM to enable real delivery.
    provider: ${EMAIL_PROVIDER:noop}
    from: ${EMAIL_FROM:}
    resend:
      api-key: ${RESEND_API_KEY:}
      base-url: ${RESEND_BASE_URL:https://api.resend.com}
