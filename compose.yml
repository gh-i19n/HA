services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-healthalst}
      POSTGRES_USER: ${POSTGRES_USER:-healthalst}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-healthalst_dev}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-healthalst}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-healthalst}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-healthalst_dev}
      CORS_ALLOWED_ORIGIN_PATTERNS: http://localhost:3003
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./client
      dockerfile: apps/image-rendering/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
        BACKEND_API_URL: http://backend:8080
    ports:
      - "3003:3000"
    environment:
      BACKEND_API_URL: http://backend:8080
    depends_on:
      - backend

volumes:
  postgres-data:
